name: dotnet

on:
  push:
    branches: [ main, feature/mvp-foundation, feature/driver-ci, feature/windows-service ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Agent
        run: dotnet restore src/AI.Guard.Agent/AI.Guard.Agent.csproj

      - name: Restore Desktop
        run: dotnet restore src/AI.Guard.Desktop/AI.Guard.Desktop.csproj

      - name: Restore Tests
        run: dotnet restore tests/AI.Guard.Core.Tests/AI.Guard.Core.Tests.csproj

      - name: Build Agent
        run: dotnet build src/AI.Guard.Agent/AI.Guard.Agent.csproj --configuration Release --no-restore

      - name: Build Desktop
        run: dotnet build src/AI.Guard.Desktop/AI.Guard.Desktop.csproj --configuration Release --no-restore

      - name: Run Core Tests
        run: dotnet test tests/AI.Guard.Core.Tests/AI.Guard.Core.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Smoke test
        shell: pwsh
        run: |
          $env:AIGUARD_POLICY = Join-Path $PWD "config\policy.sample.json"
          $output = & dotnet run --project src/AI.Guard.Agent/AI.Guard.Agent.csproj -- check "C:\AI_Guard_Protected\secret.pdf" "C:\Windows\System32\notepad.exe" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 10) {
            throw "Expected protected file access to be denied with exit code 10, got $exitCode."
          }
          exit 0
