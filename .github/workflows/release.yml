name: windows-package

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/mvp-foundation, feature/driver-ci, feature/windows-service ]
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Agent
        shell: pwsh
        run: |
          dotnet publish src/AI.Guard.Agent/AI.Guard.Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o out/Agent

      - name: Publish Desktop
        shell: pwsh
        run: |
          dotnet publish src/AI.Guard.Desktop/AI.Guard.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o out/Desktop

      - name: Stage product package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/config, package/scripts | Out-Null
          Copy-Item -Recurse out/Agent package/Agent
          Copy-Item -Recurse out/Desktop package/Desktop
          Copy-Item config/policy.sample.json package/config/policy.sample.json
          Copy-Item scripts/install.ps1 package/scripts/install.ps1
          Copy-Item scripts/uninstall.ps1 package/scripts/uninstall.ps1
          Copy-Item LICENSE.md package/LICENSE.md
          Copy-Item README.md package/README.md

          $signedDriverRoot = 'driver/signed'
          $inf = Join-Path $signedDriverRoot 'AIGuardFilter.inf'
          $sys = Join-Path $signedDriverRoot 'AIGuardFilter.sys'
          $cat = Join-Path $signedDriverRoot 'AIGuardFilter.cat'
          $driverReady = (Test-Path $inf) -and (Test-Path $sys) -and (Test-Path $cat)

          if ($driverReady) {
            $signature = Get-AuthenticodeSignature -FilePath $cat
            $driverReady = $signature.Status -eq [System.Management.Automation.SignatureStatus]::Valid `
              -and $null -ne $signature.SignerCertificate `
              -and $signature.SignerCertificate.Subject -match 'Microsoft'
          }

          $isFinalTag = $env:GITHUB_REF -match '^refs/tags/v\d+\.\d+\.\d+$'
          if ($isFinalTag -and -not $driverReady) {
            throw 'Final release tags require a valid Microsoft-signed AIGuardFilter driver package.'
          }

          if ($driverReady) {
            New-Item -ItemType Directory -Force -Path package/Driver | Out-Null
            Copy-Item $inf package/Driver/AIGuardFilter.inf
            Copy-Item $sys package/Driver/AIGuardFilter.sys
            Copy-Item $cat package/Driver/AIGuardFilter.cat
            Write-Host "Microsoft-signed Kernel Driver included: $($signature.SignerCertificate.Subject)"
          } else {
            Write-Host 'RC/development package: Kernel Driver not included.'
          }

          @"
          ROOOMTECH AI Guard
          Commit: $env:GITHUB_SHA
          Ref: $env:GITHUB_REF
          KernelDriverIncluded: $driverReady
          AgentStartup: WindowsService
          "@ | Set-Content -Path package/BUILD_INFO.txt -Encoding UTF8

          Compress-Archive -Path package/* -DestinationPath ROOOMTECH-AI-Guard-Windows-x64.zip -Force

      - name: Service install smoke test
        shell: pwsh
        run: |
          $root = (Resolve-Path package).Path
          try {
            & "$root/scripts/install.ps1" -PackageRoot $root
            $service = Get-Service -Name AIGuardAgent -ErrorAction Stop
            if ($service.Status -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
              throw "AIGuardAgent did not reach Running state: $($service.Status)"
            }
            Write-Host 'AIGuardAgent Windows Service reached Running state.'
          }
          finally {
            & "$root/scripts/uninstall.ps1"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ROOOMTECH-AI-Guard-Windows-x64
          path: ROOOMTECH-AI-Guard-Windows-x64.zip
          if-no-files-found: error
