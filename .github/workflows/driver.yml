name: driver

on:
  push:
    branches: [ main, feature/driver-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build-driver:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Add WDK tools to PATH
        shell: pwsh
        run: |
          function Find-HostTool([string]$tool) {
            $candidates = @(Get-ChildItem -Path .\packages -Filter $tool -Recurse -File -ErrorAction SilentlyContinue)
            if ($candidates.Count -eq 0) {
              return $null
            }

            $preferred = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if (-not $preferred) {
              $preferred = $candidates | Where-Object { $_.FullName -match '\\x86\\' } | Select-Object -First 1
            }
            if (-not $preferred) {
              $preferred = $candidates | Where-Object { $_.FullName -notmatch '\\ARM64\\|\\arm64\\' } | Select-Object -First 1
            }
            return $preferred
          }

          $required = @('stampinf.exe')
          $optional = @('Inf2Cat.exe', 'signtool.exe')

          foreach ($tool in $required) {
            $match = Find-HostTool $tool
            if (-not $match) {
              throw "$tool was not found for an x64/x86 host in restored WDK packages."
            }
            Write-Host "$tool => $($match.FullName)"
            Add-Content -Path $env:GITHUB_PATH -Value $match.DirectoryName
          }

          foreach ($tool in $optional) {
            $match = Find-HostTool $tool
            if ($match) {
              Write-Host "$tool => $($match.FullName)"
              Add-Content -Path $env:GITHUB_PATH -Value $match.DirectoryName
            }
          }

      - name: Build x64 Release minifilter
        shell: pwsh
        run: |
          msbuild driver/AIGuardFilter.vcxproj `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Verify driver output
        shell: pwsh
        run: |
          $sys = Get-ChildItem -Path driver -Filter AIGuardFilter.sys -Recurse | Select-Object -First 1
          if (-not $sys) {
            throw "AIGuardFilter.sys was not produced."
          }
          Write-Host "Driver: $($sys.FullName)"
          Get-FileHash $sys.FullName -Algorithm SHA256 | Format-List
